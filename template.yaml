AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Iridia Daily - Research Intelligence Newsletter

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256

Parameters:
  SenderEmail:
    Type: String
    Description: Verified sender email address
    Default: research@iridia-daily.com

  ContactListName:
    Type: String
    Description: SES Contact List name
    Default: iridia-daily-subscribers

  RecipientDisplay:
    Type: String
    Description: Display name for To field
    Default: "Iridia Daily Readers"

  AlertEmail:
    Type: String
    Description: Email for CloudWatch alarms
    Default: alerts@iridia-daily.com

  StageName:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Lowercase stage name (only lowercase letters, numbers, and hyphens)

Resources:
  # ==========================================
  # API GATEWAY (explicitly defined, custom stage)
  # ==========================================
  IridiaApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: IridiaDailyApi
      StageName: !Ref StageName
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'POST, GET, OPTIONS'"
        AllowHeaders: "'Content-Type'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40

  # ==========================================
  # SECRETS MANAGEMENT - SECURE STORAGE
  # ==========================================
  HMACSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-hmac-secret"
      Description: HMAC secret key for email confirmation tokens
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: "key"
        PasswordLength: 64
        ExcludeCharacters: "\"@/\\"
        RequireEachIncludedType: true

  # ==========================================
  # SES CONTACT LIST AND TOPICS
  # ==========================================
  NewsletterContactList:
    Type: AWS::SES::ContactList
    Properties:
      ContactListName: !Ref ContactListName
      Description: Iridia Daily newsletter subscribers
      Topics:
        - TopicName: daily-research
          DisplayName: Daily Research Newsletter
          Description: Daily scientific research insights
          DefaultSubscriptionStatus: OPT_IN
        - TopicName: space
          DisplayName: Space Research
          Description: Space and astronomy research
          DefaultSubscriptionStatus: OPT_OUT
        - TopicName: technology
          DisplayName: Technology
          Description: Technology and computing research
          DefaultSubscriptionStatus: OPT_OUT
        - TopicName: medicine
          DisplayName: Medicine
          Description: Medical research
          DefaultSubscriptionStatus: OPT_OUT
        - TopicName: biology
          DisplayName: Biology
          Description: Biology research
          DefaultSubscriptionStatus: OPT_OUT
        - TopicName: environment
          DisplayName: Environment
          Description: Environmental research
          DefaultSubscriptionStatus: OPT_OUT
        - TopicName: neuroscience
          DisplayName: Neuroscience
          Description: Brain and neuroscience research
          DefaultSubscriptionStatus: OPT_OUT
        - TopicName: physics
          DisplayName: Physics
          Description: Physics research
          DefaultSubscriptionStatus: OPT_OUT

  # ==========================================
  # SES EMAIL TEMPLATE
  # ==========================================
  NewsletterEmailTemplate:
    Type: AWS::SES::Template
    Properties:
      Template:
        TemplateName: IridiaDailyNewsletter
        SubjectPart: '{{subject}}'
        HtmlPart: '{{html_content}}'
        TextPart: '{{text_content}}'

  # ==========================================
  # SNS TOPIC FOR ALERTS
  # ==========================================
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: iridia-daily-alerts
      DisplayName: Iridia Daily Alerts
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  # ==========================================
  # IAM ROLE WITH SECRETS ACCESS
  # ==========================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: NewsletterPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ==========================================
              # SES Permissions (send, contact management)
              # ==========================================
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - ses:SendBulkEmail
                  - ses:SendBulkTemplatedEmail
                  - ses:ListContacts
                  - ses:GetContact
                  - ses:CreateContact
                  - ses:UpdateContact
                  - ses:DeleteContact
                  - ses:GetEmailIdentity
                  - ses:GetIdentityVerificationAttributes
                  - ses:GetTemplate
                  - ses:CreateTemplate
                  - ses:UpdateTemplate
                Resource: "*"

              # ==========================================
              # Bedrock Permissions
              # ==========================================
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-3-5-sonnet-20241022-v2:0"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"

              # ==========================================
              # CloudWatch Metrics
              # ==========================================
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"

              # ==========================================
              # Secrets Manager (read-only)
              # ==========================================
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref HMACSecret

  # ==========================================
  # LAMBDA FUNCTIONS
  # ==========================================
  NewsletterFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - NewsletterContactList
      - NewsletterEmailTemplate
    Properties:
      FunctionName: iridia-daily-newsletter
      CodeUri: src/
      Handler: iridia_daily.newsletter_handler.lambda_handler
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          CONTACT_LIST_NAME: !Ref ContactListName
          RECIPIENT_DISPLAY: !Sub "${RecipientDisplay} <${SenderEmail}>"
          AWS_BEDROCK_REGION: !Ref AWS::Region
          HMAC_SECRET_ARN: !Ref HMACSecret
          API_STAGE_NAME: !Ref StageName
          API_ID: !Ref IridiaApi
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 11 * * ? *)
            Description: Daily newsletter at 7am EST
            Enabled: true

  SubscribeFunction:
    Type: AWS::Serverless::Function
    DependsOn: NewsletterContactList
    Properties:
      FunctionName: iridia-daily-subscribe
      CodeUri: src/
      Handler: iridia_daily.subscribe_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CONTACT_LIST_NAME: !Ref ContactListName
          SENDER_EMAIL: !Ref SenderEmail
          HMAC_SECRET_ARN: !Ref HMACSecret
          API_STAGE_NAME: !Ref StageName
      Events:
        ApiEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref IridiaApi
            Path: /subscribe
            Method: post

  ConfirmFunction:
    Type: AWS::Serverless::Function
    DependsOn: NewsletterContactList
    Properties:
      FunctionName: iridia-daily-confirm
      CodeUri: src/
      Handler: iridia_daily.confirm_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CONTACT_LIST_NAME: !Ref ContactListName
          SENDER_EMAIL: !Ref SenderEmail
          HMAC_SECRET_ARN: !Ref HMACSecret
          API_STAGE_NAME: !Ref StageName
      Events:
        ApiEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref IridiaApi
            Path: /confirm
            Method: get

  UnsubscribeFunction:
    Type: AWS::Serverless::Function
    DependsOn: NewsletterContactList
    Properties:
      FunctionName: iridia-daily-unsubscribe
      CodeUri: src/
      Handler: iridia_daily.unsubscribe_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CONTACT_LIST_NAME: !Ref ContactListName
          HMAC_SECRET_ARN: !Ref HMACSecret
          API_STAGE_NAME: !Ref StageName
      Events:
        ApiEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref IridiaApi
            Path: /unsubscribe
            Method: get

  PreferencesFunction:
    Type: AWS::Serverless::Function
    DependsOn: NewsletterContactList
    Properties:
      FunctionName: iridia-daily-preferences
      CodeUri: src/
      Handler: iridia_daily.preferences_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CONTACT_LIST_NAME: !Ref ContactListName
          HMAC_SECRET_ARN: !Ref HMACSecret
          API_STAGE_NAME: !Ref StageName
      Events:
        GetPreferencesForm:
          Type: Api
          Properties:
            RestApiId: !Ref IridiaApi
            Path: /preferences
            Method: get
        UpdatePreferences:
          Type: Api
          Properties:
            RestApiId: !Ref IridiaApi
            Path: /preferences
            Method: post

  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: iridia-daily-health
      CodeUri: src/
      Handler: iridia_daily.health_handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          HMAC_SECRET_ARN: !Ref HMACSecret
          API_STAGE_NAME: !Ref StageName
      Events:
        HealthEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref IridiaApi
            Path: /health
            Method: get

  # ==========================================
  # CLOUDWATCH ALARMS
  # ==========================================
  NewsletterErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: iridia-newsletter-errors
      AlarmDescription: Alert on newsletter generation errors
      MetricName: NewsletterGeneration
      Namespace: IridiaDaily
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Status
          Value: Error
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  SubscriptionFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: iridia-subscription-failures
      AlarmDescription: Alert on subscription failures
      MetricName: SubscriptionAttempt
      Namespace: IridiaDaily
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Status
          Value: Error
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  NewsletterDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: iridia-newsletter-low-delivery
      AlarmDescription: Alert when newsletter delivery drops
      MetricName: NewsletterDelivered
      Namespace: IridiaDaily
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: breaching


Outputs:
  ContactListName:
    Description: SES Contact List Name
    Value: !Ref ContactListName
    Export:
      Name: !Sub "${AWS::StackName}-ContactListName"

  HMACSecretArn:
    Description: ARN of HMAC secret in Secrets Manager
    Value: !Ref HMACSecret
    Export:
      Name: !Sub "${AWS::StackName}-HMACSecretArn"

  ApiUrl:
    Description: Base API URL
    Value: !Sub "https://${IridiaApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  SubscribeEndpoint:
    Description: Subscription API endpoint
    Value: !Sub "https://${IridiaApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/subscribe"

  ConfirmEndpoint:
    Description: Confirmation API endpoint
    Value: !Sub "https://${IridiaApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/confirm"

  UnsubscribeEndpoint:
    Description: Unsubscribe API endpoint
    Value: !Sub "https://${IridiaApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/unsubscribe"

  PreferencesEndpoint:
    Description: Preferences API endpoint
    Value: !Sub "https://${IridiaApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/preferences"

  HealthCheckEndpoint:
    Description: Health check endpoint URL
    Value: !Sub "https://${IridiaApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/health"
    Export:
      Name: !Sub "${AWS::StackName}-HealthCheckEndpoint"

  AlertTopicArn:
    Description: SNS Topic for Alerts
    Value: !Ref AlertTopic
    Export:
      Name: !Sub "${AWS::StackName}-AlertTopic"