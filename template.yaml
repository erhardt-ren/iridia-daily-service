AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Iridia Daily - Research Intelligence Newsletter

Parameters:
  SenderEmail:
    Type: String
    Description: Verified sender email address
    Default: research@iridia-daily.com

  ContactListName:
    Type: String
    Description: SES Contact List name
    Default: iridia-daily-subscribers

  RecipientDisplay:
    Type: String
    Description: Display name for To field
    Default: "Iridia Daily Readers"

Resources:
  # IAM Role for all Lambda functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: NewsletterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - sesv2:*
                Resource: "*"
              
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-3-5-sonnet-20241022-v2:0"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"

  # Newsletter generation and distribution
  NewsletterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: iridia-daily-newsletter
      CodeUri: src/
      Handler: iridia_daily.newsletter_handler.lambda_handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          CONTACT_LIST_NAME: !Ref ContactListName
          RECIPIENT_DISPLAY: !Sub "${RecipientDisplay} <${SenderEmail}>"
          AWS_BEDROCK_REGION: !Ref AWS::Region
          API_URL: !Sub "https://${NewsletterApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 11 * * ? *)
            Description: Daily newsletter at 7am EST
            Enabled: true

  # Subscription requests
  SubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: iridia-daily-subscribe
      CodeUri: src/
      Handler: iridia_daily.subscribe_handler.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CONTACT_LIST_NAME: !Ref ContactListName
          SENDER_EMAIL: !Ref SenderEmail
      Events:
        ApiEndpoint:
          Type: Api
          Properties:
            Path: /subscribe
            Method: post
            RestApiId: !Ref NewsletterApi

  # Unsubscribe requests
  UnsubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: iridia-daily-unsubscribe
      CodeUri: src/
      Handler: iridia_daily.unsubscribe_handler.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CONTACT_LIST_NAME: !Ref ContactListName
      Events:
        ApiEndpoint:
          Type: Api
          Properties:
            Path: /unsubscribe
            Method: get
            RestApiId: !Ref NewsletterApi

  # API Gateway
  NewsletterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'POST, GET, OPTIONS'"
        AllowHeaders: "'Content-Type'"

Outputs:
  SubscribeEndpoint:
    Description: Subscription API endpoint
    Value: !Sub "https://${NewsletterApi}.execute-api.${AWS::Region}.amazonaws.com/prod/subscribe"
  
  UnsubscribeEndpoint:
    Description: Unsubscribe API endpoint
    Value: !Sub "https://${NewsletterApi}.execute-api.${AWS::Region}.amazonaws.com/prod/unsubscribe"
  
  ApiUrl:
    Description: Base API URL
    Value: !Sub "https://${NewsletterApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  
  NewsletterFunction:
    Description: Newsletter Lambda function name
    Value: !Ref NewsletterFunction