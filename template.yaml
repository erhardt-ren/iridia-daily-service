AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Iridia Daily - Research Intelligence Newsletter

Parameters:
  SenderEmail:
    Type: String
    Description: Verified sender email address
    Default: research@iridia-daily.com

  ContactListName:
    Type: String
    Description: SES Contact List name
    Default: iridia-daily-subscribers

  RecipientDisplay:
    Type: String
    Description: Display name for To field
    Default: "Iridia Daily Readers"

  AlertEmail:
    Type: String
    Description: Email for CloudWatch alarms
    Default: alerts@iridia-daily.com

Resources:
  # SES Contact List and Topic
  NewsletterContactList:
    Type: AWS::SES::ContactList
    Properties:
      ContactListName: !Ref ContactListName
      Description: Iridia Daily newsletter subscribers
      Topics:
        - TopicName: daily-research
          DisplayName: Daily Research Newsletter
          Description: Daily scientific research insights
          DefaultSubscriptionStatus: OPT_IN

  # SNS Topic for CloudWatch Alarms
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: iridia-daily-alerts
      DisplayName: Iridia Daily Alerts
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  # IAM Role for Lambda Functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: NewsletterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - ses:GetIdentityVerificationAttributes
                  - sesv2:*
                Resource: "*"
              
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-3-5-sonnet-20241022-v2:0"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"
              
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"

  # Newsletter Lambda Function
  NewsletterFunction:
    Type: AWS::Serverless::Function
    DependsOn: NewsletterContactList
    Properties:
      FunctionName: iridia-daily-newsletter
      CodeUri: src/
      Handler: iridia_daily.newsletter_handler.lambda_handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          CONTACT_LIST_NAME: !Ref ContactListName
          RECIPIENT_DISPLAY: !Sub "${RecipientDisplay} <${SenderEmail}>"
          AWS_BEDROCK_REGION: !Ref AWS::Region
          API_URL: !Sub "https://${NewsletterApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 11 * * ? *)
            Description: Daily newsletter at 7am EST
            Enabled: true

  # Subscribe Lambda Function
  SubscribeFunction:
    Type: AWS::Serverless::Function
    DependsOn: NewsletterContactList
    Properties:
      FunctionName: iridia-daily-subscribe
      CodeUri: src/
      Handler: iridia_daily.subscribe_handler.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CONTACT_LIST_NAME: !Ref ContactListName
          SENDER_EMAIL: !Ref SenderEmail
      Events:
        ApiEndpoint:
          Type: Api
          Properties:
            Path: /subscribe
            Method: post
            RestApiId: !Ref NewsletterApi

  # Unsubscribe Lambda Function
  UnsubscribeFunction:
    Type: AWS::Serverless::Function
    DependsOn: NewsletterContactList
    Properties:
      FunctionName: iridia-daily-unsubscribe
      CodeUri: src/
      Handler: iridia_daily.unsubscribe_handler.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CONTACT_LIST_NAME: !Ref ContactListName
      Events:
        ApiEndpoint:
          Type: Api
          Properties:
            Path: /unsubscribe
            Method: get
            RestApiId: !Ref NewsletterApi

  # API Gateway with Throttling
  NewsletterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'POST, GET, OPTIONS'"
        AllowHeaders: "'Content-Type'"
      MethodSettings:
        - ResourcePath: /subscribe
          HttpMethod: POST
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
        - ResourcePath: /unsubscribe
          HttpMethod: GET
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20

  # CloudWatch Alarms
  NewsletterErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: iridia-newsletter-errors
      AlarmDescription: Alert on newsletter generation errors
      MetricName: NewsletterGeneration
      Namespace: IridiaDaily
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Status
          Value: Error
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  SubscriptionFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: iridia-subscription-failures
      AlarmDescription: Alert on subscription failures
      MetricName: SubscriptionAttempt
      Namespace: IridiaDaily
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Status
          Value: Error
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  NewsletterDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: iridia-newsletter-low-delivery
      AlarmDescription: Alert when newsletter delivery drops
      MetricName: NewsletterDelivered
      Namespace: IridiaDaily
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: breaching

Outputs:
  ContactListName:
    Description: SES Contact List Name
    Value: !Ref ContactListName
    Export:
      Name: !Sub "${AWS::StackName}-ContactListName"
  
  SubscribeEndpoint:
    Description: Subscription API endpoint
    Value: !Sub "https://${NewsletterApi}.execute-api.${AWS::Region}.amazonaws.com/prod/subscribe"
  
  UnsubscribeEndpoint:
    Description: Unsubscribe API endpoint
    Value: !Sub "https://${NewsletterApi}.execute-api.${AWS::Region}.amazonaws.com/prod/unsubscribe"
  
  ApiUrl:
    Description: Base API URL
    Value: !Sub "https://${NewsletterApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  
  AlertTopicArn:
    Description: SNS Topic for Alerts
    Value: !Ref AlertTopic
    Export:
      Name: !Sub "${AWS::StackName}-AlertTopic"