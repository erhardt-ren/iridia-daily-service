<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe - Iridia Daily</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 {
            color: #0f2027;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .sad-emoji {
            text-align: center;
            font-size: 48px;
            margin-bottom: 20px;
        }
        .description {
            text-align: center;
            color: #6c757d;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #c82333; }
        .message {
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><h1>IRIDIA DAILY</h1></div>
        <div class="sad-emoji">😢</div>
        <p class="description">
            We're sorry to see you go! Enter your email to unsubscribe.
        </p>
        
        <form id="unsubForm">
            <input 
                type="email" 
                id="email" 
                placeholder="your@email.com" 
                required
            >
            <button type="submit" id="submitBtn">
                Unsubscribe
            </button>
        </form>
        
        <div id="message"></div>
    </div>

    <script>
        const API_ENDPOINT = 'https://j9na211lr7.execute-api.us-east-1.amazonaws.com/unsubscribe';
        
        const form = document.getElementById('unsubForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const emailInput = document.getElementById('email');
        
        // Check for email in URL
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');
        if (emailParam) {
            emailInput.value = emailParam;
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            
            try {
                const response = await fetch(`${API_ENDPOINT}?email=${encodeURIComponent(email)}`);
                
                if (response.ok) {
                    const html = await response.text();
                    document.body.innerHTML = html;
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = 'Something went wrong.';
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Network error.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Unsubscribe';
            }
        });
    </script>
</body>
</html>
