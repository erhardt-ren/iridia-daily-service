[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-fail-under=70

# Markers
markers =
    e2e: End-to-end tests
    slow: Slow running tests

[coverage:run]
source = src
omit = 
    */tests/*
    */__pycache__/*

[coverage:report]
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.